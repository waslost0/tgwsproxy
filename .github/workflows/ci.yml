name: CI

on:
  push:
    branches: [main, 'stage/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Core dependencies
        working-directory: packages/tg_proxy_core
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test packages

      - name: Analyze
        run: flutter analyze

      - name: Flutter tests
        run: flutter test

      - name: Core tests
        working-directory: packages/tg_proxy_core
        run: dart test

      - name: Prefer Maven Central for Gradle plugins
        run: |
          dir="${GRADLE_USER_HOME:-$HOME/.gradle}/init.d"
          mkdir -p "$dir"
          cp .github/gradle/init-repositories.gradle.kts "$dir/"

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Android unit tests
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest
